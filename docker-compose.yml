version: "3.8"

services:
  pipeline:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///data/crypto_warehouse.db
    command: python -m pipeline.orchestrator

  dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///data/crypto_warehouse.db
    command: streamlit run dash/dashboard.py --server.port=8501 --server.address=0.0.0.0
